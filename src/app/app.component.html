<header class="main-header">
  <!-- LEFT ZONE: Back Button + Logout -->
  <div class="header-left">
    <button *ngIf="showBackButton" (click)="goBack()">Back</button>
    <button *ngIf="LogInCheck()" (click)="logoutFromSite()">Log Out</button>
  </div>

  <!-- RIGHT ZONE: Nav & Language -->
  <div class="header-right">
    <button *ngIf="LogInCheck() && currentRoute.includes('profile')" routerLink="/homepage">Back to Homepage</button>

    <button *ngIf="AdminCheck()" (click)="switchPage()">
      {{ currentRoute.includes('overseer') ? 'Go to Homepage' : 'Go to Overseer' }}
    </button>
    <button *ngIf="LogInCheck()" routerLink="/profile">My Profile</button>

    <button (click)="switchLanguage('en')">EN</button>
    <button (click)="switchLanguage('hu')">HU</button>
  </div>
</header>

<router-outlet></router-outlet>
