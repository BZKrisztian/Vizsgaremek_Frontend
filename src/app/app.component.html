<header class="main-header">

    <button *ngIf="LogInCheck()" (click)="logoutFromSite()">Log Out</button>
    <button *ngIf="AdminCheck()" (click)="switchPage()">
        {{ currentRoute.includes('overseer') ? 'Go to Homepage' : 'Go to Overseer' }}
    </button>

    <button (click)="switchLanguage('en')">{{ 'EN' | translate }}</button>
    <button (click)="switchLanguage('hu')">{{ 'HU' | translate }}</button>
</header>
<router-outlet></router-outlet>
