<div class="confirmdialog-container">
  <h2 mat-dialog-title>{{data.title}}</h2>
  <mat-dialog-content>
    <p>{{data.message}}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button color="warn" (click)="onDeleteConfirm()">Yes</button>
    <button mat-button (click)="onCancel()">No</button>
  </mat-dialog-actions>
</div>
