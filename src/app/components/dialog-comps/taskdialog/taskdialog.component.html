<div class="taskdialog-container">
  <form (ngSubmit)="onSave()">
    
    <label for="taskTitle">Title:</label>
    <input id="taskTitle" type="text" [(ngModel)]="localTask.task_Title" name="title" required />

    <label for="taskDesc">Description:</label>
    <textarea id="taskDesc" [(ngModel)]="localTask.task_Description" name="description"></textarea>

    <mat-form-field appearance="fill">
      <mat-label>Due Date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        [(ngModel)]="localTask.due_Date"
        name="dueDate"
        readonly
      />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <label for="priority">Priority:</label>
    <select id="priority" [(ngModel)]="localTask.task_Priority" name="priority" required>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <label for="color">Color:</label>
    <input id="color" type="color" [(ngModel)]="localTask.color" name="color" />

    <button type="submit">Save</button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </form>
</div>
