<div class="profile-container">
  <h2>{{ 'Texts.Pages.Profile.ProfileTitle' | translate }}</h2>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <label>{{ 'Texts.Pages.Register.UsernameLabel' | translate }}</label>
    <input formControlName="userName" type="text" />
    <small *ngIf="profileForm.get('userName')?.invalid && profileForm.get('userName')?.touched">
      {{ 'Placeholders.UsernameHint' | translate }}
    </small>

    <label>{{ 'Texts.Pages.Register.EmailLabel' | translate }}</label>
    <input formControlName="email" type="email" />
    <small *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">
      {{ 'Errors.EmailInvalid' | translate }}
    </small>

    <label>{{ 'Texts.Pages.Profile.PasswordLabel' | translate }}</label>
    <input formControlName="password" type="password" [placeholder]="'Placeholders.PasswordHint' | translate" />

    <label>{{ 'Texts.Pages.Profile.ConfirmPasswordLabel' | translate }}</label>
    <input formControlName="confirmPassword" type="password" [placeholder]="'Placeholders.RepeatPassword' | translate" />
    <small *ngIf="profileForm.errors?.['mismatch'] && (profileForm.get('password')?.touched || profileForm.get('confirmPassword')?.touched)">
      {{ 'Errors.PasswordMismatch' | translate }}
    </small>

    <button type="submit">
      {{ 'Buttons.UpdateProfile' | translate }}
    </button>

    <hr />

    <button type="button" (click)="onClickDeleteAccount()" class="delete-account-button">
      {{ 'Buttons.DeleteAccount' | translate }}
    </button>
  </form>
</div>
