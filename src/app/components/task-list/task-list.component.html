<div class="task-list">

  <!--place tasklist creation from homepage to here(html+ts)-->
  <div>
    <h3>Create New Task List</h3>
    <form #createTaskListForm="ngForm" (ngSubmit)="createTaskList()">
      <input type="text" [(ngModel)]="newTaskList.list_Title"
      name="listTitle" required placeholder="Title of the List">
      <textarea [(ngModel)]="newTaskList.list_Description"
      name="listDescription" placeholder="the oh so beautiful description of the list"></textarea>
      <button type="submit" [disabled]="createTaskListForm.invalid">Add Task List</button>
    </form>
  </div>
  
  <!--rendering tasklist(s)-->
  <div *ngFor="let list of taskLists">
    <div *ngIf="!taskListEditingProc || taskListEditingProc.list_Id != list.list_Id " >
      <h4>{{list.list_Title}}</h4>
      <p>{{list.list_Description}}</p>
      <button (click)="onTaskListDeletion(list.list_Id)" >Delete List</button>
      <button (click)="onTaskListEdit(list)">Edit List</button>
    </div>

        <!--Add form for Task-->
        <div>
          <h4>Add New Task</h4>
          <form #createTaskForm="ngForm" (ngSubmit)="createTask(list.list_Id)">
            <input type="text" [(ngModel)]="newTask.task_Title"
            name="tasktitle" required placeholder="Task Title">
            <textarea [(ngModel)]="newTask.task_Description"
            name="taskdescription" placeholder="Description of the task"></textarea>
            <select [(ngModel)]="newTask.task_Priority" name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <button type="submit" [disabled]="createTaskForm.invalid">Add Task</button>
          </form>
        </div>

    <!--rendering task(s)-->
    <div *ngFor="let task of tasks[list.list_Id]" >
      <app-task-item
        [task]="task"
        (updatedTask)="onTaskUpdate($event)"
        (deleteTask)="onTaskDeletion(list.list_Id,$event)"
      ></app-task-item> <!-- (list.list_Id,$event) ==> list.list_Id == unnecessary(?) -->
    </div>
  
    <!--editing form for tasklist-->
    <div *ngIf="taskListEditingProc && taskListEditingProc.list_Id===list.list_Id">
      <form (ngSubmit)="onTaskListUpdate()">
        <input type="text" [(ngModel)]="taskListEditingProc.list_Title"
        name="listTitle" required placeholder="List Title">
        <textarea name="listDescription" placeholder="List Description"
        ></textarea>
        <button type="submit">Save List</button>
        <button type="button" (click)="cancelTaskListEdit()">Cancel</button>
      </form>
    </div>


  </div>
  
  <!--editing form for task-->
  <div *ngIf="taskEditingProc">
    <h3>Editing Task: </h3>
    <form (ngSubmit)="saveEditedTask()">
      <input type="text" [(ngModel)]="taskEditingProc.task_Title"
        name="title" required placeholder="Task Title" >
      <textarea
      [(ngModel)]="taskEditingProc.task_Description"
      name="taskdescription"
      placeholder="Task Description"
      ></textarea>
      <!--Dont forget Due-Date and Priority setting-->
      <button type="submit">Save Task</button>
      <button type="button" (click)="cancelEditTask()">Cancel</button>
    </form>
  </div>

</div>
