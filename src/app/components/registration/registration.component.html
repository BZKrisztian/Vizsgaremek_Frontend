<form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="registration-form">
  <h1>Register</h1>

  <div class="form-field">
    <label for="registration-username">Username</label>
    <input id="registration-username" formControlName="username" type="text" />
    <small *ngIf="registrationForm.get('username')?.invalid && registrationForm.get('username')?.touched">
      Minimum 6 characters required
    </small>
  </div>

  <div class="form-field">
    <label for="registration-email">Email</label>
    <input id="registration-email" formControlName="email" type="email" />
    <small *ngIf="registrationForm.get('email')?.invalid && registrationForm.get('email')?.touched">
      Please enter a valid email.
    </small>
  </div>

  <div class="form-field">
    <label for="registration-password">Password</label>
    <input id="registration-password" formControlName="password" type="password" />
    <small *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched">
      At least 8 characters, including 1 number and 1 uppercase letter
    </small>
  </div>

  <div class="form-field">
    <label for="registration-confirmPassword">Confirm Password</label>
    <input id="registration-confirmPassword" formControlName="confirmPassword" type="password" />
    <small *ngIf="registrationForm.get('confirmPassword')?.hasError('required') && registrationForm.get('confirmPassword')?.touched">
      Confirm Password is required.
    </small>
    <small *ngIf="registrationForm.errors?.['mismatch'] && registrationForm.get('confirmPassword')?.touched">
      Passwords must match.
    </small>
  </div>

  <button type="submit" [disabled]="registrationForm.invalid">Register</button>
</form>
