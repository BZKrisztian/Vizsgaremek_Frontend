<div class="registration-form">
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
      <div>
        <label for="registration-username">{{'Auth.Username' | translate}}</label>
        <input id="registration-username" formControlName="username" type="text" />
        <div *ngIf="registrationForm.get('username')?.invalid && registrationForm.get('username')?.touched">
          <small>Username is required. It must also be at least 6 characters</small>
        </div>
      </div>
  
      <div>
        <label for="registration-email">{{'Auth.Email' | translate}}</label>
        <input id="registration-email" formControlName="email" />
        <div *ngIf="registrationForm.get('email')?.invalid && registrationForm.get('email')?.touched">
          <small>Email is required. Ensure it is the correct format.</small>
        </div>
      </div>
  
      <div>
        <label for="registration-password">{{'Auth.Password' | translate}}</label>
        <input id="registration-password" type="password" formControlName="password" />
        <div *ngIf="registrationForm.get('password')?.invalid && registrationForm.get('password')?.touched">
          <small>Password is required. It must be at least 8 characters, and contain one upper case letter and one number.</small>
        </div>
      </div>
  
      <button type="submit" [disabled]="registrationForm.invalid">{{'Auth.Register' | translate}}</button>
    </form>
    <div *ngIf="errorMessage">{{ errorMessage }}</div>
    <div *ngIf="successMessage">{{ successMessage }}</div>
</div>
