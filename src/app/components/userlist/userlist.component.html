<div class="userlist">
  <h4>User List</h4>
  <p *ngIf="errorMessage">{{errorMessage}}</p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Creation Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{user.user_Id}}</td>
        <td>{{user.userName}}</td>
        <td>{{user.email}}</td>
        <td>{{user.acc_CR_D | date:'short'}}</td>
        <td>
          <button (click)="deleteUser(user.user_Id)">Delete</button>
          <!--update button too maybe? decide if we do updates-->
        </td>
      </tr>
    </tbody>
  </table>

</div>
