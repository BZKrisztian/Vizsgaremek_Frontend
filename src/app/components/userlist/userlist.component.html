<div class="userlist-container">

  <div class="admin-users">
    <h4>Admin List</h4>
    <p *ngIf="errorMessage">{{errorMessage}}</p>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of adminUsers">
          <td>{{user.user_Id}}</td>
          <td>{{user.userName}}</td>
          <td>{{user.email}}</td>
          <td>{{user.acc_CR_D | date:'short'}}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="regular-users">
    <h4>User List</h4>
    <p *ngIf="errorMessage">{{errorMessage}}</p>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of regularUsers">
          <td>{{user.user_Id}}</td>
          <td>{{user.userName}}</td>
          <td>{{user.email}}</td>
          <td>{{user.acc_CR_D | date:'short'}}</td>
          <td>
            <button (click)="deleteUser(user.user_Id)">Delete</button>
            <!--update button too maybe? decide if we do updates-->
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
