<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To-Do, or not To-Do</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    const savedWallpaper = localStorage.getItem('selectedWallpaper');
    if(savedWallpaper){
    document.body.style.backgroundImage = `url('assets/images/${savedWallpaper}')`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundAttachment = "fixed";
    }
  </script>
  <!-- this script is here to load the wallpaper before Angular renders the root component,
   avoiding an accidental flash of the original wallpaper that occurs if the user refreshes the page -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
